{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFRI MentorLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'assets/style.css' %}">
</head>
<body>

<nav class="navbar-custom">
    <div class="nav-container">
        <div class="logo">IFRI<span>_</span>MentorLink</div>
        
        <div class="nav-links" id="navLinks">
            <a href="{% url 'home' %}">Accueil</a>
            <a href="{% url 'matching:dashboard' %}">Tableau de bord</a>
            <a href="{% url 'matching:liste_offres' %}">Matching</a>
            <a href="{% url 'messagerie:mes_conversations' %}">Messages</a>
        </div>

        <div class="nav-actions">
            <a href="{% url 'accounts:login' %}" class="btn btn-outline">Connexion</a>
            <a href="{% url 'accounts:register' %}" class="btn btn-accent">Inscription</a>
        </div>

        <div class="mobile-menu-btn" onclick="toggleMobileMenu()">
            <i class="bi bi-list"></i>
        </div>
    </div>
</nav>

<main>
    {% block content %}
    {% endblock %}
</main>

    <script>
        function toggleMobileMenu() {
            document.getElementById('navLinks').classList.toggle('active');
        }
    </script>
</body>

</body>
</html>
